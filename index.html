<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg py-5" style="background-color: #16181f;">
            <div class="container d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <img src="images/logo.png" alt="Logo" width="68" class="me-2">
                    <div class="d-flex flex-column ms-2">
                        <a href="#" class="text-white fw-bold fs-5 text-decoration-none">Weather</a>
                        <span class="small">tagline goes here</span>
                    </div>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a href="#" class="nav-link nav-link-custom active">Home</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link nav-link-custom">News</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link nav-link-custom">Live cameras</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link nav-link-custom">Photos</a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link nav-link-custom">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    
    <section class="main-section">
        <section class="hero">
            <div class="container">
                <div class="find-location">
                    <input type="text" id="search-input" placeholder="Find your location...">
                    <button id="search-button">Find</button>
                </div>
            </div>
        </section>

        <section class="forecast-table">
            <div class="container">
                <div class="weather-forecast" id="weather-forecast">
                    <div class="today forecast">
                        <div class="forecast-header">
                            <div class="day">Tuesday</div>
                            <div class="date">29 April</div>
                        </div>
                        <div class="forecast-content">
                            <div class="location">Cairo</div>
                            <div class="degree">
                                <div class="num">--<sup>o</sup>C</div>
                                <div class="forecast-icon">
                                    <img src="" alt="" width="90"> 
                                </div>
                            </div>
                            <div class="custom">Clear</div>
                            <span ><img  src="./images/ump.png" alt=""><span id="humidity"></span></span>
                            <span><img src="./images/wind.png" alt=""><span  id="wind"></span></span>
                            <span><img src="./images/direction.png" alt=""><span id="direction"></span></span>
                        </div>
                    </div>
                    <div class="forecast tomorrow ">
                        <div class="forecast-header">
                            <div class="day">Wednesday</div>
                        </div>
                        <div class="forecast-content">
                            <div class="forecast-icon">
                                <img src="" alt="" width="48"> 
                            </div>
                            <div class="degree">--<sup>o</sup>C</div>
                            <small>--<sup>o</sup></small>
                            <div class="custom">Clear</div>
                        </div>
                    </div>
                    <div class="forecast afterTomorrow">
                        <div class="forecast-header">
                            <div class="day">Thursday</div>
                        </div>
                        <div class="forecast-content">
                            <div class="forecast-icon">
                                <img src="" alt="" width="48"> 
                            </div>
                            <div class="degree">--<sup>o</sup>C</div>
                            <small>--<sup>o</sup></small>
                            <div class="custom">Clear</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    
    </section>
    <footer>
        <div class="container">
            <div class="subscribe-form">
                <input type="text" placeholder="Enter your email to subscribe...">
                <button>Subscribe</button>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-google-plus-g"></i></a>
                <a href="#"><i class="fab fa-pinterest"></i></a>
            </div>
            <p class="copyright">Copyright 2024 Company name. Designed by Themezy. All rights reserved</p>
        </div>
    </footer>
    
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>

    



    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
